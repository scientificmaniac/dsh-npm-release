<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" role="img" aria-label="npm release">
  <defs>
    <linearGradient id="npmReleaseBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8382f"/>
      <stop offset="1" stop-color="#e2574c"/>
    </linearGradient>
  </defs>
  <!-- 包裹：npm 包。顶盖、左侧面、右侧面用同一色的三档不透明度，保持单一色相。 -->
  <path d="M18 13.4 L28.6 18.9 L18 24.4 L7.4 18.9 Z" fill="url(#npmReleaseBox)" fill-opacity="0.95"/>
  <path d="M7.4 18.9 L18 24.4 L18 32.2 L7.4 26.7 Z" fill="url(#npmReleaseBox)" fill-opacity="0.62"/>
  <path d="M28.6 18.9 L18 24.4 L18 32.2 L28.6 26.7 Z" fill="url(#npmReleaseBox)" fill-opacity="0.80"/>
  <!-- 向上的箭头从包裹里出来：发布，而不是留在本地。 -->
  <path d="M18 12.6 L18 3.8" fill="none" stroke="url(#npmReleaseBox)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M13.2 8.4 L18 3.4 L22.8 8.4" fill="none" stroke="url(#npmReleaseBox)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
